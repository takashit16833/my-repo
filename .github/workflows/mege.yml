name: Auto merge
on: pull_request
jobs:
  merge:
    # Dependabot のPRのみ
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    # マージに必要な権限
    permissions:
      contents: write
      pull-requests: write

    env:
      # GitHub CLI のクレデンシャル
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - run: gh pr merge "${GITHUB_HEAD_REF}" --merge
