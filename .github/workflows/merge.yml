name: Auto merge
on: pull_request
jobs:
  merge:
    if: ${{ github.actor == 'dependabot[bot]' }} # Dependabot のPRのみ
    runs-on: ubuntu-latest

    permissions: # マージに必要な権限
      contents: write
      pull-requests: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub CLI のクレデンシャル

    steps:
      - uses: actions/checkout@v7
      - run: gh pr merge "${GITHUB_HEAD_REF}" --merge
